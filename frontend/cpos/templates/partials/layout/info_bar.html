{# Tab Security: No. Plat, No. Tiket, Bruto, Tara, Netto.
   Tab Timbangan, Sortasi, Lab: info bar lengkap. #}
<div class="info-bar">
    <div class="info-grid">
        <div data-info="umum security">
            <label class="info-field-label" for="infoNoTiket">No. Tiket</label>
            <input type="text" id="infoNoTiket" readonly class="info-field-input">
        </div>
        <div data-info="security" class="hidden">
            <label class="info-field-label" for="infoBruto">Bruto (kg)</label>
            <input type="text" id="infoBruto" readonly value="-" class="info-field-input font-mono">
        </div>
        <div data-info="security" class="hidden">
            <label class="info-field-label" for="infoTara">Tara (kg)</label>
            <input type="text" id="infoTara" readonly value="-" class="info-field-input font-mono">
        </div>
        <div data-info="security" class="hidden">
            <label class="info-field-label" for="infoNetto">Netto (kg)</label>
            <input type="text" id="infoNetto" readonly value="-" class="info-field-input font-mono">
        </div>
        <div data-info="umum security">
            <label class="info-field-label flex items-center gap-2" for="infoPlat">No. Plat
                {# Diisi info_bar.js: kendaraan dan / atau supir tiket ini masuk blacklist (tampil di semua tab) #}
                <span id="infoBlacklist" class="hidden text-[10px] font-bold text-white bg-red-600 px-1.5 py-px rounded"></span></label>
            <input type="text" id="infoPlat" data-plat class="info-field-input uppercase"
            data-on-enter="lookupPlat" data-arg="$value" data-plat-otomatis>
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoNoDO">Nomor DO</label>
            <input type="text" id="infoNoDO" readonly class="info-field-input">
        </div>
        <div data-info="umum security">
            <label class="info-field-label" for="infoStatusAscend">
                Status Tiket
            </label>
            <input type="text" id="infoStatusAscend" readonly
                   value="-" class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoNoDO2">
                DO Kedua
            </label>
            <input type="text" id="infoNoDO2" readonly
                   value="-" class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoTiketDO2">
                Tiket DO Kedua
            </label>
            <input type="text" id="infoTiketDO2" readonly
                   value="-" class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoSupplier">Associate / Supplier</label>
            <input type="text" id="infoSupplier" readonly class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoProduk">Produk</label>
            <input type="text" id="infoProduk" readonly class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoJenis">Jenis Transaksi</label>
            <input type="text" id="infoJenis" readonly class="info-field-input">
        </div>
        <div data-info="umum">
            <label class="info-field-label" for="infoSupir">Supir</label>
            <input type="text" id="infoSupir" readonly class="info-field-input">
        </div>
    </div>

    <div class="text-center" data-info="umum">
        <div id="infoFotoBox" class="info-photo-box">
            <i class="fa-solid fa-user text-slate-300 text-3xl"></i>
        </div>
    </div>
</div>
