{% from "partials/layout/_macros.html" import section_header %}

<div class="section-box">
    {{ section_header('daftar-kontrak-ascend', 'Daftar Kontrak') }}

    <div class="filter-bar">
        <p class="text-sm text-slate-500">Data kontrak dibaca dari Ascend.</p>
        <div class="flex-1"></div>
        <div class="relative">
            <input type="text" id="cariKontrak" aria-label="Cari kontrak"
                   placeholder="Cari nomor kontrak / supplier / produk"
                   class="input-field pl-9 w-72"
                   data-on-input="cariDaftarKontrak">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2
                      -translate-y-1/2 text-slate-400 text-sm"></i>
        </div>
    </div>

    <div class="section-body overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="table-header-row">
                <tr>
                    <th class="table-cell">No. Kontrak</th>
                    <th class="table-cell">Jenis</th>
                    <th class="table-cell">Supplier / Customer</th>
                    <th class="table-cell">Produk</th>
                    <th class="table-cell">Tanggal</th>
                    <th class="table-cell text-right">Qty (kg)</th>
                    <th class="table-cell text-right">Jumlah DO</th>
                    <th class="table-cell">Status</th>
                </tr>
            </thead>
            <tbody id="tabelKontrak" class="divide-y divide-slate-100"></tbody>
        </table>
    </div>
</div>
