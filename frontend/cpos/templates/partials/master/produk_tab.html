{% from "partials/layout/_macros.html" import section_header %}
<div data-tab-content="produk" class="hidden">
    <div class="filter-bar">
        <p class="text-sm text-slate-500">Alur menentukan tahap tiket (Sortasi untuk TBS, Laboratorium untuk produk PKS).</p>
        <div class="flex-1"></div>
    </div>
    <div class="section-box">
        {{ section_header('master-produk', 'Daftar Produk') }}
        <div id="body-master-produk" class="section-body overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="table-header-row">
                    <tr><th class="table-cell">Nama Produk</th><th class="table-cell">State</th><th class="table-cell">Deskripsi</th><th class="table-cell">Standar Mutu</th>
                        <th class="table-cell">Perlu DO</th><th class="table-cell text-right">Kode Awal</th></tr><th class="table-cell text-right">Flags</th></tr>
                        <th class="table-cell text-right">QE Ratio</th></tr>
                </thead>
                <tbody data-per-halaman="20" data-boleh-ubah="{{ 1 if hak.produk.ubah else 0 }}" id="tabelProduk" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>
