<!-- MODAL: Tambah / Ubah Produk Ascend -->
<div id="modalProduk" class="modal-overlay">
    <form id="formProduk" class="modal-box" autocomplete="off">
        <div class="modal-header">
            <h3 id="judulModalProduk" class="font-bold">Tambah Produk</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalProduk" title="Tutup">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-6 space-y-3">
            <input type="hidden" name="id_produk">

            <div>
                <label class="field-label" for="prodNama">Nama Produk</label>
                <input type="text" id="prodNama" name="nama_produk"
                       required maxlength="30" class="input-field">
            </div>

            <div>
                <label class="field-label" for="prodState">State</label>
                <input type="text" id="prodState" name="state"
                       required maxlength="10" value="Liquid" class="input-field">
            </div>

            <div>
                <label class="field-label" for="prodDeskripsi">Deskripsi</label>
                <input type="text" id="prodDeskripsi" name="deskripsi"
                       maxlength="100" class="input-field">
            </div>

            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="prodReqDo" name="req_do" value="1">
                Produk memerlukan DO
            </label>

            <div>
                <label class="field-label" for="prodKodeAwal">Kode Awal</label>
                <input type="text" id="prodKodeAwal" name="kode_awal"
                       maxlength="10" class="input-field">
            </div>

            <div>
                <label class="field-label" for="prodFlags">Flags</label>
                <input type="text" id="prodFlags" name="prod_flags"
                       maxlength="100" class="input-field">
            </div>

            <div>
                <label class="field-label" for="prodQeRatio">QE Ratio</label>
                <input type="number" id="prodQeRatio" name="qe_ratio"
                       min="0" step="0.0001" value="1" class="input-field">
            </div>
        </div>

        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal"
                    data-arg="modalProduk" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>
