<div data-tab-content="security" class="hidden">

    <div class="section-box">
        <div class="px-5 py-3.5 border-b border-slate-100">
            <span class="text-sm font-bold text-slate-900">Pendaftaran Tiket Kosong</span>
        </div>

        <form id="formTiket" class="p-5 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Kolom kiri -->
                <div class="space-y-4">
                    <div>
                        <label class="field-label" for="tiketTicketType">Jenis Tiket</label>
                        <select id="tiketTicketType" name="ticket_type" required class="input-field">
                            <option value="">-- Pilih --</option>
                            <option value="Produk">Produk · Penjualan</option>
                            <option value="TBSLuar">TBS Luar · Penerimaan</option>
                        </select>
                    </div>

                    <div>
                        <div class="mb-2 flex items-center justify-start gap-3">
                            <label class="field-label mb-0" for="tiketNoDoChoice">
                                Nomor DO / SP
                            </label>

                            <label class="flex items-center gap-2 text-xs text-slate-600">
                                <input id="tiketNoDoManualToggle" type="checkbox" class="rounded">
                                Input manual
                            </label>
                        </div>

                        <div id="tiketNoDoSelectWrap">
                            <select id="tiketNoDoChoice" required class="input-field">
                                <option value="">-- Pilih --</option>
                            </select>
                        </div>

                        <div id="tiketNoDoManualWrap" class="hidden mt-2">
                            <input type="text" id="tiketNoDoManual" maxlength="50"
                                class="input-field uppercase"
                                placeholder="Ketik nomor DO atau SP">
                        </div>

                        <input type="hidden" id="tiketNoDoValue" name="no_do">
                        <p id="tiketInfoDO" class="field-hint">
                            Pilih jenis tiket untuk mencari DO outstanding, atau centang input manual.
                        </p>
                    </div>

                    <div>
                        <label class="field-label" for="tiketAssociate">Associate</label>
                        <select id="tiketAssociate" name="associate_id" required class="input-field">
                            <option value="">-- Pilih --</option>
                        </select>
                    </div>

                    <div>
                        <label class="field-label" for="tiketShipper">Shipper / Pengirim</label>
                        <select id="tiketShipper" name="shipper_id" class="input-field">
                            <option value="">-- Pilih --</option>
                        </select>
                    </div>                    

                    <div>
                        <label class="field-label" for="tiketTanggal">Tanggal</label>
                        <input id="tiketTanggal" name="tanggal" type="date" required class="input-field">
                    </div>
                </div>

                <!-- Kolom kanan -->
                <div class="space-y-4">

                    <div>
                        <label class="field-label">Supir Terakhir Truk</label>

                        <div id="tiketSupirKartu"
                            class="border border-slate-200 rounded-lg p-4 flex items-center gap-4 bg-slate-50 min-h-24">
                            <div id="tiketSupirFoto" class="info-photo-box">
                                <i class="fa-solid fa-user text-slate-300 text-3xl"></i>
                            </div>

                            <div class="min-w-0">
                                <div id="tiketSupirTerakhir" class="text-sm text-slate-500">
                                    Isi nomor kendaraan untuk melihat riwayat supir.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="field-label" for="tiketProduk">Produk</label>
                        <select id="tiketProduk" name="produk" required class="input-field">
                            <option value="">-- Pilih --</option>
                        </select>
                    </div>

                    <div>
                        <div class="mb-2 flex items-center justify-start gap-3">
                            <label class="field-label mb-0" for="tiketVehicleNo">No. Plat</label>

                            <label class="flex items-center gap-2 text-xs text-slate-600">
                                <input id="tiketVehicleManualToggle" type="checkbox" class="rounded">
                                Input manual
                            </label>
                        </div>

                        <div id="tiketVehicleSelectWrap">
                            <select id="tiketVehicleNo" name="vehicle_no" required class="input-field">
                                <option value="">-- Pilih Shipper dahulu --</option>
                            </select>
                        </div>

                        <div id="tiketVehicleManualWrap" class="hidden">
                            <input id="tiketVehicleManual" name="vehicle_no" type="text"
                                maxlength="50" class="input-field uppercase"
                                placeholder="Contoh: BM 9999 SAD" disabled>
                        </div>
                    </div>

                    <div>
                        <label class="field-label" for="tiketMill">Mill</label>
                        <select id="tiketMill" name="mill_id" required class="input-field">
                            <option value="">-- Pilih --</option>
                            {% for m in mill_list %}
                            <option value="{{ m.mill_id }}">{{ m.mill_id }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                                       
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="btnBuatTiket" type="submit" class="btn-primary">
                    Buat Tiket
                </button>
                <span id="hasilTiket" class="text-sm font-semibold text-emerald-700"></span>
            </div>
        </form>
    </div>
</div>
