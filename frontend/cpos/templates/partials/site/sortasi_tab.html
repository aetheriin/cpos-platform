<div data-tab-content="sortasi" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Input Penilaian Mutu Buah</h3>
            <div class="grid grid-cols-2 gap-4">
                <div><label for="srMentah" class="field-label">Buah Mentah (%)</label><input type="number" id="srMentah" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label for="srBusuk" class="field-label">Buah Busuk (%)</label><input type="number" id="srBusuk" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label for="srTangkai" class="field-label">Tangkai Panjang (%)</label><input type="number" id="srTangkai" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label for="srSampah" class="field-label">Sampah/Kotoran (%)</label><input type="number" id="srSampah" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label for="srMatang" class="field-label">Buah Matang (%)</label><input type="number" id="srMatang" class="input-field"></div>
                <div><label for="srBrondolan" class="field-label">Brondolan (%)</label><input type="number" id="srBrondolan" class="input-field"></div>
            </div>

            <div class="mt-4">
                <label for="srDeductionKg" class="field-label">Potongan (kg)</label>
                <input type="number" min="0" step="0.01" id="srDeductionKg"
                    class="input-field" data-on-input="hitungPotongan">
            </div>

            <div class="mt-4">
                <label for="srCatatan" class="field-label">Catatan</label><textarea id="srCatatan" class="input-field" rows="2"></textarea></div>
            <button data-on-click="submitSortasi" data-arg="$el" class="btn-primary mt-4 w-full"><i class="fa-solid fa-floppy-disk"></i> Simpan Hasil Sortasi</button>
        </div>

        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Ringkasan Kalkulasi & Potongan</h3>
            <table class="w-full text-sm">
                <tr>
                    <td class="py-2 text-slate-700 font-medium">Potongan yang disimpan</td>
                    <td class="py-2 text-right font-bold text-red-600" id="srTotalPotongan">- kg</td>
                </tr>
            </table>
        </div>
    </div>

    <div class="section-box mt-5">
        <div class="section-header" data-on-click="toggleSection" data-arg="history-sortasi">
            <span class="section-header-text"><i id="chevron-history-sortasi" class="fa-solid fa-chevron-down section-chevron"></i> Riwayat Sortasi</span>
        </div>
        <div id="body-history-sortasi" class="section-body">
            <table class="w-full text-left text-sm">
                <thead class="table-header-row"><tr><th class="table-cell">No. Plat</th><th class="table-cell">Produk</th><th class="table-cell">Supplier</th><th class="table-cell">Status</th></tr></thead>
                <tbody data-per-halaman="20" id="tabelHistorySortasi" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>
