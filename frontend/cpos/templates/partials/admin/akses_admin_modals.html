<!-- MODAL: pilih user penerima akses Admin -->
<div id="modalAaUser" class="modal-overlay">
    <div class="modal-box max-w-lg" role="dialog" aria-modal="true" aria-labelledby="aaUserJudul">
        <div class="modal-header">
            <h3 id="aaUserJudul" class="font-bold">Pilih user</h3>
            <button type="button" class="aturan-tombol shrink-0" data-on-click="closeModal" data-arg="modalAaUser" title="Tutup" aria-label="Tutup"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="p-4 space-y-3">
            <label class="field-label" for="aaCariUser">Cari user</label>
            <input type="search" id="aaCariUser" class="input-field" placeholder="NIK, nama, atau username">
            <div id="aaHasilUser" class="max-h-80 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100" aria-live="polite"></div>
        </div>
    </div>
</div>
