<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belum ada akses · CPOS</title>
    {% include "partials/layout/ikon_tab.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    {% include "partials/layout/bahasa.html" %}
</head>
<body class="hal-error font-sans antialiased min-h-screen flex flex-col">
    <main class="relative z-10 flex-1 flex items-center justify-center px-6 py-10">
        <div class="text-center max-w-xl">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="mx-auto w-14 h-14">
            <h1 class="mt-6 text-2xl sm:text-3xl font-bold tracking-tight hal-error-navy">Akun Anda belum memiliki akses</h1>
            <p class="mt-3 text-sm sm:text-base hal-error-redup">Anda masuk sebagai {{ current_user.nama_lengkap }}, tapi belum ada menu yang dibuka untuk akun ini. Minta admin mengatur akses Anda.</p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
                <a href="/tanpa-akses" class="hal-error-tombol"><i class="fa-solid fa-rotate-right"></i> Periksa lagi</a>
                <form method="post" action="/logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="hal-error-tombol-2"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
