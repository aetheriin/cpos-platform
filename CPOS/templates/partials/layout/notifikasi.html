{# Wadah toast & dialog konfirmasi (dipakai ui.js: Notif, Dialog) #}
<div id="notifWadah" class="notif-wadah" aria-live="polite"></div>

<div id="dialogKonfirmasi" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="dialogJudul">
    <div class="modal-box">
        <div class="p-6 space-y-3">
            <div class="flex items-start gap-3">
                <span id="dialogIkon" class="dialog-ikon"><i class="fa-solid fa-circle-question"></i></span>
                <div class="min-w-0 space-y-1.5">
                    <h3 id="dialogJudul" class="font-bold text-slate-800 text-base"></h3>
                    <p id="dialogPesan" class="text-sm text-slate-600 whitespace-pre-line"></p>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="dialogBatal" class="btn-secondary" data-on-click="jawabDialog" data-arg="$false">Batal</button>
                <button type="button" id="dialogYa" class="btn-primary" data-on-click="jawabDialog" data-arg="$true">Ya</button>
            </div>
        </div>
    </div>
</div>
